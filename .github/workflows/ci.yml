name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build, test, lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev pkg-config \
            libxkbcommon-dev libwayland-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --verbose
      - run: cargo test --workspace --verbose
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: CPU-only build (no GPU loader)
        run: cargo build -p vc-app --no-default-features --features ai
      - name: Engine self-test (every preset, synthetic speech)
        run: target/debug/voice-changer --self-test
      - name: Validate desktop entry and AppStream metadata
        run: |
          sudo apt-get install -y desktop-file-utils appstream
          desktop-file-validate packaging/io.github.zerodaylabz.VoiceChanger.desktop
          appstreamcli validate --no-net packaging/io.github.zerodaylabz.VoiceChanger.metainfo.xml
      - name: Shell scripts parse
        run: for f in scripts/*.sh packaging/aur/PKGBUILD; do bash -n "$f"; done

  # Starts a private PipeWire (daemon + WirePlumber + the PulseAudio bridge)
  # on the runner, runs the app headless on a test file, records the virtual
  # microphone through the PulseAudio API the way Discord and browsers do,
  # and checks that the voice came out changed. This is the test that says
  # "it works on Ubuntu", not just "it compiles".
  audio-smoke:
    name: PipeWire smoke test (virtual mic end to end)
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev pkg-config \
            libxkbcommon-dev libwayland-dev libasound2-dev \
            pipewire pipewire-pulse pipewire-audio-client-libraries wireplumber \
            pulseaudio-utils python3-numpy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p vc-app --no-default-features --features ai
      - name: Start a private PipeWire session
        run: |
          export XDG_RUNTIME_DIR=/tmp/pw-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          # No sound card on a runner: a null sink gives the monitor stream
          # somewhere to go, and WirePlumber a default device.
          cat > /tmp/pw.conf <<'EOF'
          context.properties = { default.clock.rate = 48000 default.clock.quantum = 256 }
          context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert support.* = support/libspa-support }
          context.modules = [
            { name = libpipewire-module-rt args = { nice.level = -11 } flags = [ ifexists nofail ] }
            { name = libpipewire-module-protocol-native }
            { name = libpipewire-module-client-node }
            { name = libpipewire-module-adapter }
            { name = libpipewire-module-metadata }
            { name = libpipewire-module-link-factory }
            { name = libpipewire-module-session-manager }
          ]
          context.objects = [
            { factory = adapter args = { factory.name = support.null-audio-sink node.name = ci-speakers media.class = Audio/Sink audio.position = [ FL FR ] } }
            { factory = adapter args = { factory.name = support.null-audio-sink node.name = ci-microphone media.class = Audio/Source/Virtual audio.position = [ MONO ] } }
          ]
          EOF
          PIPEWIRE_CONFIG_DIR=/tmp pipewire -c pw.conf > /tmp/pipewire.log 2>&1 &
          sleep 1
          wireplumber > /tmp/wireplumber.log 2>&1 &
          pipewire-pulse > /tmp/pipewire-pulse.log 2>&1 &
          sleep 2
          pactl info
          pw-cli ls Node | grep -E "node.name|media.class" | head -20
      - name: Doctor
        run: target/debug/voice-changer doctor || true
      - name: Run the voice changer on a test file and record its microphone
        run: |
          target/debug/voice-changer --no-dbus --headless --on --preset Robot \
            --input-wav synth --source-name vc_ci > /tmp/vc.log 2>&1 &
          APP=$!
          sleep 4
          timeout 6 parec -d vc_ci --file-format=wav --channels=1 --rate=48000 /tmp/robot.wav || true
          kill -INT $APP; sleep 2
          target/debug/voice-changer --no-dbus --headless --bypass \
            --input-wav synth --source-name vc_ci2 > /tmp/vc2.log 2>&1 &
          APP=$!
          sleep 4
          timeout 6 parec -d vc_ci2 --file-format=wav --channels=1 --rate=48000 /tmp/bypass.wav || true
          kill -INT $APP; sleep 1
          cat /tmp/vc.log | grep -vE "ort::" | tail -30
      - name: Check that audio came through and was changed
        run: python3 scripts/ci/check-capture.py /tmp/robot.wav /tmp/bypass.wav
      - name: Logs on failure
        if: failure()
        run: |
          echo "--- pipewire"; cat /tmp/pipewire.log
          echo "--- wireplumber"; cat /tmp/wireplumber.log
          echo "--- pipewire-pulse"; cat /tmp/pipewire-pulse.log
          echo "--- app"; cat /tmp/vc.log /tmp/vc2.log
