name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev pkg-config \
            libxkbcommon-dev libwayland-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --verbose
      - run: cargo test --workspace --verbose
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Validate desktop entry and AppStream metadata
        run: |
          sudo apt-get install -y desktop-file-utils appstream
          desktop-file-validate packaging/io.github.zerodaylabz.VoiceChanger.desktop
          appstreamcli validate --no-net packaging/io.github.zerodaylabz.VoiceChanger.metainfo.xml
