name: Build and Release

# Runs when a tag like `v0.3.0` is pushed. Produces, for x86_64 and aarch64:
# a portable tarball (runs on glibc 2.35+: Ubuntu 22.04, Debian 12, Mint 21,
# Zorin 17 and newer), an RPM, a .deb; plus a Flatpak bundle and checksums.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Oldest glibc the binaries may require (Ubuntu 22.04 / Debian 12 era).
  GLIBC_TARGET: "2.35"

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            deb_arch: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            deb_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev pkg-config \
            libxkbcommon-dev libwayland-dev libasound2-dev binutils
      - name: Install zig and cargo-zigbuild (links against an older glibc)
        run: |
          python3 -m pip install --user ziglang cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The headers come from the 24.04 runner (the pipewire crate needs
      # recent ones to compile); the link goes through zig against glibc
      # 2.35 so the result also starts on 22.04-era systems.
      - name: Build the app (portable) and the CLAP plugin
        run: |
          # zig's compiler and linker do not search the distribution's
          # multiarch directories (where Ubuntu keeps libpipewire and the
          # OpenSSL headers that a build-time dependency needs). Expose only
          # the OpenSSL headers: adding the whole directory lets the system's
          # bits/ headers shadow zig's own glibc headers.
          MULTIARCH="$(gcc -print-multiarch)"
          mkdir -p /tmp/zig-include
          ln -sfn "/usr/include/$MULTIARCH/openssl" /tmp/zig-include/openssl
          # The runner's libpipewire was built against a newer glibc than
          # our 2.35 target; its internal references are resolved by the
          # user's own glibc at run time, so do not let lld reject them.
          export RUSTFLAGS="-L native=/usr/lib/$MULTIARCH -C link-arg=-Wl,--allow-shlib-undefined"
          export CFLAGS="-I/tmp/zig-include"
          cargo zigbuild --release -p vc-app --target ${{ matrix.target }}.${GLIBC_TARGET}
          # The plugin goes through the same link: on Linux a .clap bundle
          # is the shared object itself, so no bundler step is needed.
          cargo zigbuild --release -p vc-plugin --target ${{ matrix.target }}.${GLIBC_TARGET}
          unset RUSTFLAGS CFLAGS
          mkdir -p target/release target/bundled
          cp target/${{ matrix.target }}/release/voice-changer target/release/voice-changer
          cp target/${{ matrix.target }}/release/libvc_plugin.so target/bundled/vc-plugin.clap

      - name: Strip debug symbols
        run: |
          strip -s target/release/voice-changer
          strip -s target/bundled/vc-plugin.clap

      - name: Check portability (glibc / libstdc++ requirements)
        run: scripts/check-portable.sh target/release/voice-changer target/bundled/vc-plugin.clap

      - name: Self-test on the runner
        run: |
          target/release/voice-changer --version
          target/release/voice-changer --self-test

      # The default build loads ONNX Runtime at run time (so the same binary
      # can use the distribution's ROCm/CUDA build on GPUs). Ship Microsoft's
      # CPU build as the fallback for machines without one.
      - name: Fetch ONNX Runtime (CPU)
        run: scripts/get-onnxruntime.sh --arch ${{ matrix.arch }} target/onnxruntime

      - name: Package tarball
        run: |
          mkdir -p dist/voice-changer
          cp target/release/voice-changer target/bundled/vc-plugin.clap dist/voice-changer/
          cp target/onnxruntime/libonnxruntime.so* dist/voice-changer/
          cp -r packaging scripts README.md LICENSE CHANGELOG.md dist/voice-changer/
          tar -C dist -czf voice-changer-linux-${{ matrix.arch }}.tar.gz voice-changer

      - name: Install cargo-generate-rpm and cargo-deb
        run: cargo install cargo-generate-rpm cargo-deb

      - name: Generate RPM (Fedora, openSUSE, RHEL family)
        run: cargo generate-rpm -p crates/vc-app

      - name: Generate .deb (Debian, Ubuntu, Mint, Zorin, Pop)
        run: cargo deb -p vc-app --no-build --no-strip

      - name: Collect
        run: |
          mkdir -p out
          cp voice-changer-linux-${{ matrix.arch }}.tar.gz out/
          cp target/generate-rpm/*.rpm out/
          cp target/debian/*.deb out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/*

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Generate offline cargo sources
        run: |
          python3 -m pip install --user aiohttp toml || pip3 install aiohttp toml
          curl -fsSLo /tmp/flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 /tmp/flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: VoiceChanger.flatpak
          manifest-path: packaging/flatpak/io.github.zerodaylabz.VoiceChanger.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: VoiceChanger.flatpak

  release:
    name: Publish release
    needs: [linux, flatpak]
    if: always() && needs.linux.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out/*
