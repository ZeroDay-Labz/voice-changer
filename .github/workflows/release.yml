name: Build and Release

# Runs when a tag like `v0.1.0` is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux binary, CLAP plugin, RPM and deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev pkg-config \
            libxkbcommon-dev libwayland-dev libasound2-dev

      - name: Build the app and the plugin
        run: |
          cargo build --release -p vc-app
          cargo xtask bundle vc-plugin --release

      - name: Strip debug symbols
        run: |
          strip -s target/release/voice-changer
          strip -s target/bundled/vc-plugin.clap

      # The default build loads ONNX Runtime at run time (so the same binary
      # can use the distribution's ROCm build on AMD GPUs). Ship Microsoft's
      # CPU build as the fallback for machines without one.
      - name: Fetch ONNX Runtime (CPU)
        run: scripts/get-onnxruntime.sh target/onnxruntime

      - name: Package tarball
        run: |
          mkdir -p dist/voice-changer
          cp target/release/voice-changer target/bundled/vc-plugin.clap dist/voice-changer/
          cp target/onnxruntime/libonnxruntime.so* dist/voice-changer/
          cp -r packaging scripts README.md LICENSE CHANGELOG.md dist/voice-changer/
          tar -C dist -czf voice-changer-linux-x86_64.tar.gz voice-changer

      - name: Install cargo-generate-rpm and cargo-deb
        run: cargo install cargo-generate-rpm cargo-deb

      - name: Generate Fedora RPM
        run: cargo generate-rpm -p crates/vc-app

      - name: Generate Debian/Ubuntu deb
        run: cargo deb -p vc-app --no-build

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            voice-changer-linux-x86_64.tar.gz
            target/generate-rpm/*.rpm
            target/debian/*.deb
