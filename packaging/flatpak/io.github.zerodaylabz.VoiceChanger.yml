# Flatpak manifest for Voice Changer (ZeroDay-Labz). DRAFT: builds, but the
# AI converter (Python venv) does not run inside the sandbox, so .pth imports
# fall back to "convert outside, drop the .onnx in the voices folder".
#
# Build (needs flatpak-builder, the freedesktop 25.08 SDK and its rust-stable
# and llvm20 extensions; see packaging/flatpak/README.md):
#   flatpak-builder --user --install --force-clean build-dir \
#     packaging/flatpak/io.github.zerodaylabz.VoiceChanger.yml
#
# cargo-sources.json must be generated from Cargo.lock first (offline build,
# as Flathub requires) — see README.md next to this file.

app-id: io.github.zerodaylabz.VoiceChanger
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: voice-changer

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The virtual microphone is a native PipeWire node.
  - --filesystem=xdg-run/pipewire-0
  - --socket=pulseaudio
  # Voice library downloads (Hugging Face) and the base-model download.
  - --share=network
  # Tray icon (StatusNotifierItem) and the app's own control interface.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.voicechanger.Control
  # Global shortcut and autostart go through portals (no extra permission).

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
  env:
    CARGO_HOME: /run/build/voice-changer/cargo
    LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib

modules:
  - name: voice-changer
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked -p vc-app
      - install -Dm755 target/release/voice-changer /app/bin/voice-changer
      - install -Dm644 packaging/io.github.zerodaylabz.VoiceChanger.desktop
        /app/share/applications/io.github.zerodaylabz.VoiceChanger.desktop
      - install -Dm644 packaging/io.github.zerodaylabz.VoiceChanger.metainfo.xml
        /app/share/metainfo/io.github.zerodaylabz.VoiceChanger.metainfo.xml
      - install -Dm644 packaging/io.github.zerodaylabz.VoiceChanger.svg
        /app/share/icons/hicolor/scalable/apps/io.github.zerodaylabz.VoiceChanger.svg
      - install -Dm644 packaging/icons/256.png
        /app/share/icons/hicolor/256x256/apps/io.github.zerodaylabz.VoiceChanger.png
    sources:
      - type: dir
        path: ../..
      - cargo-sources.json
